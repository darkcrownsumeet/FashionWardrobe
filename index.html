    <title>FashionWardrobe — Bespoke Sartorial Curation</title>

        content="FashionWardrobe is a premier sartorial atelier that suggests curated ensembles and refined accessories tailored to your unique aesthetic, social engagements, and discerning preferences." />

    <!-- Tailwind CSS CDN (from Stitch) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        window.addEventListener('error', function(e) {
            console.error('GLOBAL ERROR:', e.message, e.filename, e.lineno);
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:999999;padding:10px;font-family:monospace;word-break:break-all;';
            errDiv.innerText = 'ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
            document.documentElement.appendChild(errDiv);
        });
        window.addEventListener('unhandledrejection', function(e) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:50px;left:0;right:0;background:darkred;color:white;z-index:999999;padding:10px;font-family:monospace;word-break:break-all;';
            errDiv.innerText = 'PROMISE REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
            document.documentElement.appendChild(errDiv);
        });
    </script>

        */

        /* --- Glitch ® --- */
        @keyframes glitch {
            0%, 92%, 100% { opacity: 1; transform: translate(0); clip-path: none; }
            93%  { opacity: 0.8; transform: translate(-2px, 1px); clip-path: inset(20% 0 60% 0); }
            95%  { opacity: 0.9; transform: translate(2px, -1px); clip-path: inset(60% 0 10% 0); }
            97%  { opacity: 0.7; transform: translate(-1px, 0px); clip-path: inset(40% 0 40% 0); }
        }
        .glitch-badge {
            display: inline-block;
            animation: glitch 4s infinite;
            color: var(--color-brand, #ff0000);
        }

        /* --- Curtain reveal (clip-path) on style cards --- */
        .curtain-img {
            clip-path: inset(0 100% 0 0);
            transition: clip-path 0.7s cubic-bezier(0.77, 0, 0.18, 1), filter 0.7s ease;
        }
        .group:hover .curtain-img {
            clip-path: inset(0 0% 0 0);
        }

        /* --- Parallax hero wrapper --- */
        .parallax-hero {
            will-change: transform;
            transition: transform 0.1s linear;
        }

        /* --- Driver.js Premium Aesthetics --- */
        div.driver-popover {
            background-color: #111111 !important;
            color: #ffffff !important;
            border: 2px solid #ff0000 !important;
            border-radius: 0 !important;
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1) !important;
            padding: 24px !important;
            font-family: 'Inter', sans-serif !important;
            cursor: default !important;
        }
        
        .dark div.driver-popover {
            box-shadow: 8px 8px 0px 0px rgba(255,255,255,1) !important;
        }

        div.driver-popover-title {
            font-family: 'Montserrat', sans-serif !important;
            text-transform: uppercase !important;
            letter-spacing: -0.05em !important;
            font-weight: 800 !important;
            font-size: 1.2rem !important;
            margin-bottom: 12px !important;
            color: #ff0000 !important;
            cursor: text !important;
        }

        div.driver-popover-description {
            font-family: 'JetBrains Mono', monospace !important;
            text-transform: uppercase !important;
            font-size: 0.7rem !important;
            letter-spacing: 0.1em !important;
            line-height: 1.6 !important;
            color: #ffffff !important;
            opacity: 0.8 !important;
            font-weight: 400 !important;
            cursor: text !important;
        }

        div.driver-popover-footer button {
            background-color: transparent !important;
            border: 1px solid #ff0000 !important;
            color: #ff0000 !important;
            font-family: 'JetBrains Mono', monospace !important;
            text-transform: uppercase !important;
            font-size: 0.7rem !important;
            letter-spacing: 0.1em !important;
            border-radius: 0 !important;
            text-shadow: none !important;
            transition: all 0.2s ease !important;
        }
        div.driver-popover-footer button:hover {
            background-color: #ff0000 !important;
            color: #ffffff !important;
        }
        
        @keyframes pulse-highlight {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }
        .driver-active-element {
            animation: pulse-highlight 2s infinite !important;
        }

        div.driver-popover-close-btn {
            color: #ffffff !important;
            opacity: 0.5 !important;
            transition: opacity 0.3s ease !important;
        }
        
        div.driver-popover-close-btn:hover {
            opacity: 1 !important;
        }

        /* The arrow pointing to the element */
        div.driver-popover-arrow-side-left { border-left-color: #ff0000 !important; }
        div.driver-popover-arrow-side-right { border-right-color: #ff0000 !important; }
        div.driver-popover-arrow-side-top { border-top-color: #ff0000 !important; }
        div.driver-popover-arrow-side-bottom { border-bottom-color: #ff0000 !important; }
    </style>
